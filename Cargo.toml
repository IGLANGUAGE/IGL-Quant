[package]
name = "igl-quant"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.91"
wgpu = { version = "0.20", features = ["webgl"] }
js-sys = "0.3.68"
web-sys = { version = "0.3.68", features = ["Window", "Gpu"] }

