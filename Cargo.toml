[package]
name = "igl-quant"
version = "0.1.0"
edition = "2021"
description = "IGL-Quant: High-performance quantum computing and physics simulation framework"
repository = "https://github.com/IGLANGUAGE/IGL-Quant"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.92"
wgpu = { version = "0.20", features = ["webgl"] }
js-sys = "0.3.69"
web-sys = { version = "0.3.69", features = ["Window", "Gpu", "GpuDevice"] }
